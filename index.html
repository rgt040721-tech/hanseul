<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가천대 스마트 무당이 대기 현황</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* 화면 전체를 지도로 채우기 */
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Arial', sans-serif; }
        #map { width: 100vw; height: 100vh; z-index: 1; }

        /* 지도 위에 뜰 예쁜 카드 디자인 */
        .bus-stop-card { 
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
            text-align: center; 
            width: 150px; /* 글씨가 안 잘리게 살짝 늘림 */
            border-top: 6px solid #003894; /* 가천대 블루 */
            position: relative;
            left: -75px; 
            top: -40px;
            transition: all 0.3s ease; /* 부드러운 색상 전환 */
        }
        
        .bus-stop-card h3 { margin: 0 0 10px 0; color: #333; font-size: 1rem; }
        .count-box { font-size: 2.5rem; font-weight: bold; color: #003894; margin: 5px 0; }
        .status { font-size: 0.8rem; color: #666; }
        
        /* 마커 기본 배경 없애기 */
        .leaflet-div-icon { background: transparent; border: none; }

        /* 🚨 버스 도착 시 적용될 특수 디자인 (깜빡임 효과) */
        .bus-here-card {
            border-top: 6px solid #e53935; /* 빨간색 띠 */
            background-color: #ffebee; /* 연한 핑크 배경 */
            animation: blink 1s infinite alternate; /* 깜빡거림 애니메이션 */
        }
        .bus-here-text {
            font-size: 1.5rem; /* 글씨가 기니까 크기를 살짝 줄임 */
            color: #e53935;
        }
        
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.8; box-shadow: 0 0 15px rgba(229, 57, 53, 0.5); }
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 지도 띄우기 (가천대학교 무당이 정류장 중심 좌표)
    var univLocation = [37.4509, 127.1271]; 
    var map = L.map('map').setView(univLocation, 16);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var cardHTML = `
        <div class="bus-stop-card" id="card-container">
            <h3>🚌 무당이 정류장</h3>
            <div class="status" id="status-label">현재 대기 인원</div>
            <div class="count-box" id="people-count">..</div>
            <div class="status" id="last-update" style="font-size: 0.7rem; color: #999; margin-top: 5px;">업데이트 중..</div>
        </div>
    `;
