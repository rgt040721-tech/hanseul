<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가천대 스마트 무당이 대기 현황</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Arial', sans-serif; }
        #map { width: 100vw; height: 100vh; z-index: 1; }

        .bus-stop-card { 
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
            text-align: center; 
            width: 150px; 
            border-top: 6px solid #003894; /* 가천대 블루 */
            position: relative;
            left: -75px; 
            top: -40px;
            transition: all 0.3s ease; 
        }
        .bus-stop-card h3 { margin: 0 0 10px 0; color: #333; font-size: 1rem; }
        .count-box { font-size: 2.5rem; font-weight: bold; color: #003894; margin: 5px 0; }
        .status { font-size: 0.8rem; color: #666; font-weight: bold; }
        
        .leaflet-div-icon { background: transparent; border: none; }

        /* 🚨 버스 도착 시 효과 */
        .bus-here-card {
            border-top: 6px solid #e53935;
            background-color: #ffebee;
            animation: blink 1s infinite alternate;
        }
        .bus-here-text { font-size: 1rem; color: #e53935; margin-top: 5px; }
        
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.8; box-shadow: 0 0 15px rgba(229, 57, 53, 0.5); }
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 지도 띄우기 (두 정류장 중간쯤으로 설정)
    var map = L.map('map').setView([37.4525, 127.1300], 16); 

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // ==========================================
    // 📍 정류장 1: AI관 정류장 (유저님 담당)
    // ==========================================
    var aiStopLocation = [37.4535, 127.1330]; 
    var aiCardHTML = `
        <div class="bus-stop-card" id="ai-card">
            <h3>🤖 AI관 정류장</h3>
            <div class="status">대기 인원</div>
            <div class="count-box" id="ai-count">..</div>
            <div class="status" id="ai-status">대기 중...</div>
        </div>
    `;
    var aiIcon = L.divIcon({ html: aiCardHTML, className: 'custom-marker' });
    L.marker(aiStopLocation, { icon: aiIcon }).addTo(map);

    // ==========================================
    // 📍 정류장 2: 반도체관 정류장 (친구분 담당)
    // ==========================================
    var semiStopLocation = [37.4509, 127.1271]; // 반도체관 좌표로 수정 필요
    var semiCardHTML = `
        <div class="bus-stop-card" id="semi-card">
            <h3>💻 반도체대학 정류장</h3>
            <div class="status">대기 인원</div>
            <div class="count-box" id="semi-count">..</div>
            <div class="status" id="semi-status">대기 중...</div>
        </div>
    `;
    var semiIcon = L.divIcon({ html: semiCardHTML, className: 'custom-marker' });
    L.marker(semiStopLocation, { icon: semiIcon }).addTo(map);

    // ==========================================
    // 🔄 파이어베이스 실시간 데이터 연동
    // ==========================================
    // 전체 방(queue) 데이터를 한 번에 가져옵니다.
    const url = "https://smart-muddangyee-queue-default-rtdb.firebaseio.com/queue.json";

    function updateCount() {
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data) {
                    // --- 1. AI관 데이터 업데이트 ---
                    if (data.ai_station) {
                        document.getElementById('ai-count').innerText = data.ai_station.people_count || 0;
                        
                        const aiCard = document.getElementById('ai-card');
                        const aiStatus = document.getElementById('ai-status');
                        
                        if (data.ai_station.bus_arrived === true) {
                            aiCard.classList.add('bus-here-card');
                            aiStatus.classList.add('bus-here-text');
                            aiStatus.innerText = "🚨 무당이 도착 🚨";
                        } else {
                            aiCard.classList.remove('bus-here-card');
                            aiStatus.classList.remove('bus-here-text');
                            aiStatus.innerText = "무당이를 기다리는 중...";
                        }
                    }

                    // --- 2. 반도체관 데이터 업데이트 ---
                    if (data.semi_station) {
                        document.getElementById('semi-count').innerText = data.semi_station.people_count || 0;
                        
                        const semiCard = document.getElementById('semi-card');
                        const semiStatus = document.getElementById('semi-status');
                        
                        if (data.semi_station.bus_arrived === true) {
                            semiCard.classList.add('bus-here-card');
                            semiStatus.classList.add('bus-here-text');
                            semiStatus.innerText = "🚨 무당이 도착 🚨";
                        } else {
                            semiCard.classList.remove('bus-here-card');
                            semiStatus.classList.remove('bus-here-text');
                            semiStatus.innerText = "무당이를 기다리는 중...";
                        }
                    }
                }
            })
            .catch(error => console.error('데이터를 가져오는데 실패했습니다:', error));
    }

    setInterval(updateCount, 2000);
    updateCount();
</script>

</body>
</html>
